<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Portal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: #e8f0ff;
      background: radial-gradient(circle at top right, #3a2a8f 0%, transparent 35%),
                  linear-gradient(135deg, #0b1020, #111b35 45%, #091626);
    }

    .card {
      width: min(560px, 100%);
      padding: 30px;
      border-radius: 20px;
      background: rgba(14, 22, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }

    p {
      color: #adbbd6;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      color: #081324;
      font-weight: 700;
      background: linear-gradient(120deg, #62d7ff, #7e7bff);
      transition: transform 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Jack's Resource Portal</h1>
    <p>Everything has moved to a cleaner dashboard experience. Continue to the game hub to access study breaks and activity links.</p>
    <a href="games.html">Open the Games Hub</a>
  </main>
</body>
</html>
