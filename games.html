<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Hub</title>
  <style>
    :root {
      --bg: #060b17;
      --panel: rgba(12, 20, 38, 0.78);
      --border: rgba(255, 255, 255, 0.14);
      --text: #e9f2ff;
      --muted: #98accb;
      --accent: #5ed0ff;
      --accent-2: #7a67ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, rgba(122, 103, 255, 0.28), transparent 30%),
                  radial-gradient(circle at 90% 15%, rgba(94, 208, 255, 0.22), transparent 25%),
                  var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      padding: 28px;
    }

    .wrap {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45);
    }

    .top {
      padding: 24px;
      margin-bottom: 18px;
    }

    h1 { margin: 0 0 8px 0; }

    .lead { margin: 0; color: var(--muted); }

    .auth {
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    input {
      flex: 1 1 280px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 11px 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #051022;
    }

    #error {
      color: #ff9ab0;
      min-height: 20px;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      padding: 20px;
    }

    .game {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 14px;
    }

    .game h2 { margin: 0 0 8px 0; font-size: 1.05rem; }
    .game p { margin: 0 0 12px 0; color: var(--muted); font-size: 0.9rem; }

    .game a {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(120deg, #7a67ff, #5ed0ff);
      padding: 8px 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel top">
      <h1>Extra Study Materials</h1>
      <p class="lead">Enter your Beta Access Key to open the game list.</p>
    </section>

    <section class="panel auth" id="auth">
      <label for="key">Access Key</label>
      <div class="row">
        <input id="key" type="password" placeholder="Consult Jack if you need the key" aria-label="Access key">
        <button id="enter">Unlock</button>
      </div>
      <div id="error"></div>
    </section>

    <section class="panel grid" id="games">
      <article class="game"><h2>2048</h2><p>Tile puzzle challenge.</p><a href="2048/index.html" target="_blank" rel="noopener">Play</a></article>
      <article class="game"><h2>Dino</h2><p>Classic jumping runner.</p><a href="dino/index.html" target="_blank" rel="noopener">Play</a></article>
      <article class="game"><h2>Slope 2</h2><p>High-speed reaction game.</p><a href="slope2/index.html" target="_blank" rel="noopener">Play</a></article>
      <article class="game"><h2>1v1LOL</h2><p>Build and battle.</p><a href="1v1lol/index.html" target="_blank" rel="noopener">Play</a></article>
      <article class="game"><h2>PolyTrack</h2><p>Stylized racer.</p><a href="polytrack/index.html" target="_blank" rel="noopener">Play</a></article>
      <article class="game"><h2>EaglerCraft</h2><p>Sandbox adventure.</p><a href="eaglrcraft/index.html" target="_blank" rel="noopener">Play</a></article>
    </section>
  </div>

  <script>
    const input = document.getElementById('key');
    const error = document.getElementById('error');
    const auth = document.getElementById('auth');
    const games = document.getElementById('games');

    function unlock() {
      const key = atob('OTI3ODA5MTI=');
      if (input.value === key) {
        auth.style.display = 'none';
        games.style.display = 'grid';
      } else {
        error.textContent = 'Invalid key. Redirecting...';
        setTimeout(() => {
          window.location.href = 'https://www.google.com';
        }, 700);
      }
    }

    document.getElementById('enter').addEventListener('click', unlock);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        unlock();
      }
    });
  </script>
</body>
</html>
